[workspace]
resolver = "2"
members = ["control", "agent", "gateway", "wasm", "storage", "identity", "common", "cli"]

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
uuid = { version = "1.8", features = ["serde", "v4"] }
ed25519-dalek = "2.1"
x25519-dalek = "2.0"
chacha20poly1305 = "0.10"
blake3 = "1.5"
hkdf = "0.12"
rand = "0.8"
async-trait = "0.1"
bytes = "1.5"
http = "1.1"
tonic = "0.11"
prost = "0.12"
prost-types = "0.12"
wasmtime = "19.0"
wasmtime-wasi = "19.0"
wasi-nn = "0.2"
mdns-sd = "0.11"
libp2p = { version = "0.54", features = ["kad", "mdns", "noise", "yamux", "tcp", "quic", "websocket"] }
minio = "0.4"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "tls-rustls"] }
opa-wasm = "0.1"

quinn = "0.10"
config = "0.14"
figment = "0.10"
dirs = "5.0"
anyhow = "1.0"
parking_lot = "0.12"
dashmap = "5.5"
futures = "0.3"
axum = { version = "0.7", features = ["macros", "json", "ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
opentelemetry = "0.24"
opentelemetry-otlp = "0.17"
metrics = "0.21"
metrics-exporter-prometheus = "0.13"
nix = { version = "0.27", features = ["process"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = true
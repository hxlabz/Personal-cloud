apiVersion: v1
kind: Namespace
metadata:
  name: hxnet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hxnet-config
  namespace: hxnet
data:
  DATABASE_URL: "postgres://hxnet:hxnet@postgres:5432/hxnet"
  ETCD_ENDPOINTS: "http://etcd:2379"
  MINIO_HOT_ENDPOINT: "http://minio-hot:9000"
  MINIO_HOT_ACCESS_KEY: "hxnet"
  MINIO_HOT_SECRET_KEY: "hxnet123"
  MINIO_HOT_BUCKET: "hxnet-hot"
  MINIO_COLD_ENDPOINT: "http://minio-cold:9000"
  MINIO_COLD_ACCESS_KEY: "hxnet"
  MINIO_COLD_SECRET_KEY: "hxnet123"
  MINIO_COLD_BUCKET: "hxnet-cold"
  HEADSCALE_URL: "http://headscale:8080"
  RP_ID: "hxnet.local"
  RP_ORIGIN: "https://hxnet.local"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: hxnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      containers:
      - name: control-plane
        image: hxnet/control-plane:latest
        ports:
        - containerPort: 8080
        - containerPort: 9090
        envFrom:
        - configMapRef:
            name: hxnet-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: hxnet
spec:
  selector:
    app: control-plane
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: metrics
    port: 9090
    targetPort: 9090
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent-full
  namespace: hxnet
spec:
  selector:
    matchLabels:
      app: agent-full
  template:
    metadata:
      labels:
        app: agent-full
    spec:
      containers:
      - name: agent-full
        image: hxnet/agent:latest
        env:
        - name: NODE_CLASS
          value: "full"
        - name: CONTROL_PLANE_URL
          value: "http://control-plane:8080"
        envFrom:
        - configMapRef:
            name: hxnet-config
        ports:
        - containerPort: 8081
        - containerPort: 8082
        - containerPort: 9091
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "2000m"
        securityContext:
          privileged: true
        volumeMounts:
        - name: kvm
          mountPath: /dev/kvm
      volumes:
      - name: kvm
        hostPath:
          path: /dev/kvm
      tolerations:
      - operator: Exists
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-edge
  namespace: hxnet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agent-edge
  template:
    metadata:
      labels:
        app: agent-edge
    spec:
      containers:
      - name: agent-edge
        image: hxnet/agent:latest
        env:
        - name: NODE_CLASS
          value: "edge"
        - name: CONTROL_PLANE_URL
          value: "http://control-plane:8080"
        envFrom:
        - configMapRef:
            name: hxnet-config
        ports:
        - containerPort: 8081
        - containerPort: 9091
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: agent-edge
  namespace: hxnet
spec:
  selector:
    app: agent-edge
  ports:
  - name: http
    port: 8081
    targetPort: 8081
  - name: metrics
    port: 9091
    targetPort: 9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: hxnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: hxnet/gateway:latest
        env:
        - name: CONTROL_PLANE_URL
          value: "http://control-plane:8080"
        envFrom:
        - configMapRef:
            name: hxnet-config
        ports:
        - containerPort: 8083
        - containerPort: 9092
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        securityContext:
          privileged: true
        volumeMounts:
        - name: usb
          mountPath: /dev/ttyUSB0
      volumes:
      - name: usb
        hostPath:
          path: /dev/ttyUSB0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: hxnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
    spec:
      containers:
      - name: identity
        image: hxnet/identity:latest
        envFrom:
        - configMapRef:
            name: hxnet-config
        ports:
        - containerPort: 8084
        - containerPort: 9093
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: hxnet
spec:
  selector:
    app: identity
  ports:
  - name: http
    port: 8084
    targetPort: 8084
  - name: metrics
    port: 9093
    targetPort: 9093
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hxnet
      POSTGRES_USER: hxnet
      POSTGRES_PASSWORD: hxnet
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./control/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hxnet -d hxnet"]
      interval: 5s
      timeout: 5s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    command:
      - /usr/local/bin/etcd
      - --name=hxnet-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=hxnet-etcd=http://etcd:2380
      - --initial-cluster-token=hxnet-cluster
      - --initial-cluster-state=new
    volumes:
      - etcd_data:/etcd-data
    ports:
      - "2379:2379"
      - "2380:2380"

  minio-hot:
    image: minio/minio:RELEASE.2024-01-16
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hxnet
      MINIO_ROOT_PASSWORD: hxnet123
    volumes:
      - minio_hot_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-cold:
    image: minio/minio:RELEASE.2024-01-16
    command: server /data --console-address ":9002"
    environment:
      MINIO_ROOT_USER: hxnet
      MINIO_ROOT_PASSWORD: hxnet123
    volumes:
      - minio_cold_data:/data
    ports:
      - "9003:9000"
      - "9004:9001"

  ceph-mon:
    image: ceph/ceph:v18.2.0
    command: mon
    environment:
      CEPH_PUBLIC_NETWORK: 172.20.0.0/24
      MON_NAME: mon1
      CEPH_CLUSTER_NAME: hxnet
    volumes:
      - ceph_mon_data:/var/lib/ceph
      - ceph_etc:/etc/ceph
    network_mode: host

  ceph-osd:
    image: ceph/ceph:v18.2.0
    command: osd
    environment:
      OSD_DEVICE: /dev/loop0
      OSD_TYPE: directory
      CEPH_CLUSTER_NAME: hxnet
    volumes:
      - ceph_osd_data:/var/lib/ceph/osd
      - ceph_etc:/etc/ceph
    network_mode: host
    privileged: true

  headscale:
    image: headscale/headscale:0.22.3
    command: headscale serve
    environment:
      HEADSCALE_SERVER_URL: http://headscale:8080
      HEADSCALE_DATABASE_TYPE: sqlite3
      HEADSCALE_DATABASE_URL: file:/data/headscale.db
    volumes:
      - headscale_data:/data
      - ./headscale/config.yaml:/etc/headscale/config.yaml
    ports:
      - "8080:8080"
      - "9090:9090"

  derp:
    image: headscale/derp:0.22.3
    command: derp -hostname=derp.local -certmode=manual -certdir=/certs -stun-port=3478
    volumes:
      - derp_certs:/certs
    ports:
      - "3478:3478/udp"
      - "443:443"

  control-plane:
    build:
      context: ../control
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://hxnet:hxnet@postgres:5432/hxnet
      ETCD_ENDPOINTS: http://etcd:2379
      BIND_ADDR: 0.0.0.0:8080
      METRICS_ADDR: 0.0.0.0:9090
      RUST_LOG: info
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      etcd:
        condition: service_started
      minio-hot:
        condition: service_healthy

  agent-full:
    build:
      context: ../agent
      dockerfile: Dockerfile
    environment:
      NODE_CLASS: full
      CONTROL_PLANE_URL: http://control-plane:8080
      BIND_ADDR: 0.0.0.0:8081
      METRICS_ADDR: 0.0.0.0:9091
      RUST_LOG: info
    ports:
      - "8081:8081"
      - "9091:9091"
      - "8082:8082/udp"
    depends_on:
      - control-plane
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm

  agent-edge:
    build:
      context: ../agent
      dockerfile: Dockerfile
    environment:
      NODE_CLASS: edge
      CONTROL_PLANE_URL: http://control-plane:8080
      BIND_ADDR: 0.0.0.0:8081
      METRICS_ADDR: 0.0.0.0:9091
      RUST_LOG: info
    ports:
      - "8083:8081"
      - "9092:9091"
    depends_on:
      - control-plane

  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    environment:
      CONTROL_PLANE_URL: http://control-plane:8080
      BIND_ADDR: 0.0.0.0:8083
      METRICS_ADDR: 0.0.0.0:9092
      RUST_LOG: info
    ports:
      - "8083:8083"
      - "9092:9092"
    depends_on:
      - control-plane
    privileged: true
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0

  identity:
    build:
      context: ../identity
      dockerfile: Dockerfile
    environment:
      RP_ID: hxnet.local
      RP_ORIGIN: http://localhost:8084
      DATABASE_URL: postgres://hxnet:hxnet@postgres:5432/hxnet
      BIND_ADDR: 0.0.0.0:8084
      METRICS_ADDR: 0.0.0.0:9093
      RUST_LOG: info
    ports:
      - "8084:8084"
      - "9093:9093"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.48.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.4.0
    command: -config.file=/etc/tempo/tempo.yaml
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres_data:
  etcd_data:
  minio_hot_data:
  minio_cold_data:
  ceph_mon_data:
  ceph_osd_data:
  ceph_etc:
  headscale_data:
  derp_certs:
  prometheus_data:
  grafana_data: